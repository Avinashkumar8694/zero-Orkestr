events {
    worker_connections 1024;
}

http {
    upstream jbpm_cluster {
        # PILLAR 4: Session affinity (ip_hash ensures same client IP routes to the same replica for WebSockets)
        ip_hash;
        server engine-1:4000 max_fails=3 fail_timeout=10s;
        server engine-2:4000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # WebSocket endpoint with session affinity and keep-alive
        location /ws {
            proxy_pass http://jbpm_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Stateless REST API & UI endpoints
        location / {
            proxy_pass http://jbpm_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
